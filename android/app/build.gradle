plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.device_owner_app"
    compileSdkVersion 34 // Updated to the latest version

    ndkVersion = flutter.ndkVersion
    viewBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.device_owner_app"
        minSdkVersion 23
        targetSdkVersion 34 // Updated to the latest version
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias 'downer'
            keyPassword 'sanjib292'
            storeFile file('/Users/asifhussain/Desktop/downer.keystore')
            storePassword 'sanjib292'
        }

        debug {
            keyAlias 'downer'
            keyPassword 'sanjib292'
            storeFile file('/Users/asifhussain/Desktop/downer.keystore')
            storePassword 'sanjib292'
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation platform('com.google.firebase:firebase-bom:33.1.1')
    implementation 'com.google.firebase:firebase-messaging:22.0.0'
    implementation 'androidx.core:core-ktx:1.10.1' // Updated version
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' // Updated to the latest version
    implementation 'com.google.android.material:material:1.9.0' // Updated version
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // Updated version
    implementation 'androidx.appcompat:appcompat:1.6.1' // Updated version
    implementation "androidx.security:security-crypto:1.1.0-alpha03"
    implementation "androidx.work:work-runtime-ktx:2.8.1" // Uncommented and kept the latest version
}

configurations.all {
    resolutionStrategy {
        force 'com.android.support:support-v4:28.0.0'
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' // Updated Kotlin version
    }
}

flutter {
    source = "../.."
}
